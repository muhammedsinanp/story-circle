services:
  app:
    build: .
    restart: unless-stopped
    environment:
      APP_ORIGIN: https://${APP_DOMAIN:?Set APP_DOMAIN in .env}
      INSTAGRAM_ENABLED: ${INSTAGRAM_ENABLED:-false}
      ALLOWED_IG_USERS: ${ALLOWED_IG_USERS:-}
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
  https:
    image: caddy:2
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
volumes:
  caddy_data:
  caddy_config:
